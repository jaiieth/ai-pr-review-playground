# PR-Agent repo config for erp-api. Read from the default branch (main) only.
# Model / endpoint / headers live in .github/workflows/pr-agent.yml (host-level).

[config]
response_language = "th-TH"
# Do not skip bot/agent PRs (defaults "^[Auto]"/"^Auto" would)
ignore_pr_title = []
ignore_pr_authors = []

[github]
ignore_bot_pr = false

[github_app]
ignore_bot_pr = false

[github_action_config]
push_trigger_ignore_bot_commits = false

[ignore]
glob = [
  "bun.lock",
  "CHANGELOG.md",
  "prisma/migrations/**",
  "diff_report.sql",
  "**/*.snap",
]

[pr_reviewer]
require_tests_review = true
require_security_review = true
require_estimate_effort_to_review = true
num_max_findings = 8
persistent_comment = true
extra_instructions = """
ตอบเป็นภาษาไทย ยกเว้นชื่อไฟล์ ชื่อฟังก์ชัน และโค้ดให้คงเป็นภาษาอังกฤษ
PR อาจมาจากคนหรือ bot/AI agent ให้ตรวจด้วยมาตรฐานเดียวกัน

โปรเจกต์นี้คือ NestJS + Prisma (Bun) ที่ port มาจาก PowerBuilder ERP
หัวข้อด้านล่างเป็น "ลำดับความสำคัญ" ไม่ใช่ขอบเขตจำกัด ให้ตรวจทุกเรื่องที่พบปัญหาจริง

เน้นเป็นพิเศษ (เฉพาะโปรเจกต์):
- ความถูกต้องของ business logic เทียบกับ PowerBuilder เดิม (itemchanged, validation, update/cancel flow)
- Prisma: transaction, P2025/relation errors, การ map column/timezone (update_date, Asia/Bangkok)
- validation ด้วย zod (nestjs-zod) และ error message ภาษาไทย
- e2e/unit test ที่ขาดสำหรับ mutation ใหม่

ตรวจทั่วไปด้วยเสมอ:
- ความถูกต้องของ logic และ edge case (ค่าว่าง, ขอบเขตตัวเลข/วันที่, list ว่าง, ข้อมูลซ้ำ)
- null/undefined handling และ optional chaining ที่ซ่อน bug
- error handling: catch แล้วกลืน error, status code/exception ไม่ตรง, ข้อความรั่วข้อมูลภายใน
- concurrency/race condition: read-modify-write ไม่อยู่ใน transaction, running number/sequence ซ้ำ, lost update
- security: authn/authz (guard, สิทธิ์ราย role/สาขา), SQL injection ผ่าน $queryRaw/$executeRaw, mass assignment, secret/credential ใน code หรือ log
- performance: N+1 query, query ใน loop, select เกินจำเป็น, ขาด index สำหรับ where/order by ใหม่, ไม่มี pagination
- API contract: DTO/response shape ตรงกับ schema/frontend, breaking change ของ endpoint, ชื่อ field/type ไม่สอดคล้อง
- backward compatibility: Prisma migration ที่ทำลายข้อมูล, เปลี่ยน default/enum, ลบ field ที่ยังมีคนใช้
- readability/maintainability: logic ซ้ำ, ฟังก์ชันยาว/ซับซ้อนเกินไป, magic number, ชื่อที่ทำให้เข้าใจผิด, dead code
- logging/observability และ resource leak (connection, stream, timer)

ไม่ต้องติเรื่อง formatting/lint ที่ Biome ตรวจอยู่แล้ว
"""

[pr_code_suggestions]
num_code_suggestions_per_chunk = 4
suggestions_score_threshold = 6
extra_instructions = """
ตอบเป็นภาษาไทย
เสนอแก้ทุกจุดที่มีผลจริง ไม่จำกัดเฉพาะ business logic ของ ERP ได้แก่:
bug/logic ผิด, edge case, null handling, error handling, race condition/transaction,
security (authz, injection, secret), performance (N+1, query ใน loop, index), API/DTO ไม่สอดคล้อง,
backward compatibility, และ maintainability ที่ช่วยลด bug ได้ชัดเจน (เช่น logic ซ้ำ, ฟังก์ชันซับซ้อนเกินไป)
ไม่ต้องเสนอเรื่อง formatting, import order หรือ lint ที่ Biome ตรวจอยู่แล้ว
"""

[pr_description]
extra_instructions = "เขียนสรุปเป็นภาษาไทย"
