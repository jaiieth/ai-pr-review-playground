name: OCR Review

# The only automatic reviewer: Alibaba open-code-review (OCR) v1.13.3 via the OpenCode Go subscription.
# Credential: repo var OPENCODE_CLIENT_ID = OpenCode service-account credential (GitHub OIDC, 1-hour token,
#   no stored key; pull_request events only). Without it: secret OPENCODE_GO_API_KEY (oc_sk_... from the
#   Go-subscribed workspace). See 'Sign in to OpenCode'. Only pull_request events (no workflow_dispatch).
# Optional repo variables (Settings > Secrets and variables > Actions > Variables):
#   OCR_MODEL              default deepseek-v4.1-flash   (supported: deepseek-*, glm-5.3-flash)
#   OCR_PROTOCOL           default anthropic             (anthropic | openai)
#   OCR_THINKING           default on                    (on | off; anthropic on = budget_tokens 8000)
#   OCR_REVIEW_DRAFTS      default false                 (true = also review draft PRs on open/push)
#   OCR_TRIGGER_LABEL      default ai-review             (adding it reviews the PR now, draft or not;
#                                                         remove + re-add to run again; ClickUp "Review")
#   AI_SKIP_HEAD_BRANCHES  default main,develop          (comma list, no spaces; head branches never
#                                                         reviewed = release/sync PRs; shared with opencode.yml)
#   AI_SKIP_HEAD_PREFIX    default release/              (head branches starting with it are skipped;
#                                                         set to - to disable; shared with opencode.yml)
# Each push reviews only the commits since the last completed review (checkpoint_range) and never
# re-posts a comment on lines that already have one (incremental). A newer push cancels a running review.
# Review rules / ignore paths: .opencodereview/rule.json (OCR's project rule layer).

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions: {}

jobs:
  ocr-review:
    # Bot/agent PRs ARE reviewed (no actor/sender filter). Skipped jobs never start (0 minutes).
    # Triggers:
    #   labeled with OCR_TRIGGER_LABEL          -> always (drafts too, skip list ignored: explicit request);
    #                                              remove + re-add the label to run again
    #   ready_for_review                        -> full review (OCR always reviews the whole PR on
    #                                              ready/reopened, also after a label review; inline
    #                                              comments on lines that already have one are skipped)
    #   opened / reopened / synchronize         -> non-draft PRs (drafts only if OCR_REVIEW_DRAFTS == 'true'),
    #                                              head branch not in the skip list
    #   head branch in AI_SKIP_HEAD_BRANCHES / starting with AI_SKIP_HEAD_PREFIX = release / sync PRs
    #   (skipped). Task PRs branch-x -> main ARE reviewed.
    if: >
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == (vars.OCR_TRIGGER_LABEL || 'ai-review')) ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled' &&
       !contains(format(',{0},', vars.AI_SKIP_HEAD_BRANCHES || 'main,develop'), format(',{0},', github.head_ref)) &&
       !(vars.AI_SKIP_HEAD_PREFIX != '-' && startsWith(github.head_ref, vars.AI_SKIP_HEAD_PREFIX || 'release/')) &&
       (!github.event.pull_request.draft || vars.OCR_REVIEW_DRAFTS == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One review per PR at a time; a newer push cancels the running review (the next run reviews
    # from the last recorded checkpoint, so cancelled work is picked up). Job-level so skipped
    # runs (other labels, drafts) never enter or cancel the group.
    concurrency:
      group: ocr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read        # checkout + git fetch of base / PR head
      pull-requests: write  # inline review comments + sticky summary comment
      id-token: write       # GitHub OIDC token for the OpenCode service-account sign-in
    steps:
      - name: Sign in to OpenCode
        # vars.OPENCODE_CLIENT_ID set -> OpenCode service-account token via GitHub OIDC (1 hour; the
        # console credential trusts pull_request workflows of this repo; fork PRs get no OIDC token).
        # Not set -> secrets.OPENCODE_GO_API_KEY. Exported as env OPENCODE_API_KEY for later steps.
        id: auth
        env:
          CLIENT_ID: ${{ vars.OPENCODE_CLIENT_ID }}
          KEY: ${{ vars.OPENCODE_CLIENT_ID == '' && secrets.OPENCODE_GO_API_KEY || '' }}
        run: |
          set -uo pipefail
          # Never prints the OIDC token, the OpenCode token or the key (masked before use).
          if [ -n "$CLIENT_ID" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              echo "::error::No GitHub OIDC token in this run (fork PR, or the job lacks id-token: write)"
              exit 1
            fi
            # Same calls as the OpenCode console snippet.
            oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://opencode.ai/console" | jq -r '.value // empty') || oidc=''
            [ -n "$oidc" ] && echo "::add-mask::$oidc"
            resp=$(mktemp)
            status=$(curl -sS -o "$resp" -w '%{http_code}' -X POST https://opencode.ai/console/auth/oauth/token \
              -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
              -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
              -d "client_id=$CLIENT_ID" \
              -d "subject_token=$oidc") || status=000
            token=$(jq -r '.access_token // empty' "$resp" 2>/dev/null) || token=''
            if [ -z "$token" ]; then
              echo "::error::OpenCode token exchange failed (HTTP $status): $(jq -c '{error, error_description}' "$resp" 2>/dev/null || echo 'non-JSON response'). Check the OPENCODE_CLIENT_ID credential in the OpenCode console (it must trust pull_request workflows of ${GITHUB_REPOSITORY})."
              rm -f "$resp"
              exit 1
            fi
            echo "::add-mask::$token"
            echo "OpenCode sign-in: service-account token (HTTP $status, expires in $(jq -r '.expires_in // "?"' "$resp")s)"
            rm -f "$resp"
          elif [ -n "$KEY" ]; then
            token=$KEY
            echo "OpenCode sign-in: secrets.OPENCODE_GO_API_KEY"
          else
            echo "::error::No OpenCode credential: set repo var OPENCODE_CLIENT_ID (service account) or secret OPENCODE_GO_API_KEY. Fork PRs never get secrets; Dependabot PRs read Dependabot secrets."
            exit 1
          fi
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Map model / protocol / thinking to OCR inputs
        id: llm
        env:
          VAR_MODEL: ${{ vars.OCR_MODEL }}
          VAR_PROTOCOL: ${{ vars.OCR_PROTOCOL }}
          VAR_THINKING: ${{ vars.OCR_THINKING }}
        run: |
          # repo var > default
          MODEL="$(echo "${VAR_MODEL:-deepseek-v4.1-flash}" | tr '[:upper:]' '[:lower:]')"
          PROTOCOL="$(echo "${VAR_PROTOCOL:-anthropic}" | tr '[:upper:]' '[:lower:]')"
          THINKING="$(echo "${VAR_THINKING:-on}" | tr '[:upper:]' '[:lower:]')"

          if [[ ! "$MODEL" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::Invalid model id '$MODEL'"; exit 1
          fi
          case "$THINKING" in off|on) ;; *)
            echo "::error::OCR_THINKING must be off or on (got '$THINKING')"; exit 1 ;;
          esac

          # GLM-5.3-Flash cannot run with thinking off: force on, effort low.
          if [ "$MODEL" = "glm-5.3-flash" ] && [ "$THINKING" = "off" ]; then
            echo "::warning::glm-5.3-flash always thinks; using thinking=on (openai: effort low, anthropic: budget_tokens 8000)"
            THINKING=on
          fi

          # Never use effort max: OCR caps completion tokens at 16384 (issue #1532).
          case "$PROTOCOL" in
            openai)
              URL="https://opencode.ai/inference/go/openai/v1"   # OCR appends /chat/completions
              USE_ANTHROPIC=false
              case "$MODEL:$THINKING" in
                deepseek-*:off)
                  EXTRA_BODY='{"thinking":{"type":"disabled"}}'; EFFORT='' ;;
                deepseek-*:on|glm-5.3-flash:on)
                  EXTRA_BODY='{"thinking":{"type":"enabled"}}'; EFFORT=low ;;
                *)
                  echo "::error::Unsupported model '$MODEL' (thinking=$THINKING) on openai. Supported: deepseek-*, glm-5.3-flash"; exit 1 ;;
              esac
              ;;
            anthropic)
              URL="https://opencode.ai/inference/go/anthropic"   # OCR appends /v1/messages
              USE_ANTHROPIC=true
              EFFORT=''   # llm_reasoning_effort is rejected by OCR on the Anthropic protocol
              case "$MODEL:$THINKING" in
                deepseek-*:off)
                  EXTRA_BODY='{"thinking":{"type":"disabled"}}' ;;
                # budget_tokens must stay below OCR's 16384 completion cap or thinking is dropped.
                # Live-tested 2026-11-01 on Go: thinking replay (empty signature) returns 200.
                deepseek-*:on|glm-5.3-flash:on)
                  EXTRA_BODY='{"thinking":{"type":"enabled","budget_tokens":8000}}' ;;
                *)
                  echo "::error::Unsupported on anthropic: model '$MODEL' with thinking=$THINKING. Supported: deepseek-* (off|on), glm-5.3-flash (on)."; exit 1 ;;
              esac
              ;;
            *)
              echo "::error::OCR_PROTOCOL must be openai or anthropic (got '$PROTOCOL')"; exit 1 ;;
          esac

          echo "OCR config: model=$MODEL protocol=$PROTOCOL thinking=$THINKING effort=${EFFORT:-<none>} url=$URL extra_body=$EXTRA_BODY"
          {
            echo "model=$MODEL"
            echo "protocol=$PROTOCOL"
            echo "url=$URL"
            echo "use_anthropic=$USE_ANTHROPIC"
            echo "extra_body=$EXTRA_BODY"
            echo "effort=$EFFORT"
          } >> "$GITHUB_OUTPUT"

      - name: OpenCodeReview
        # alibaba/open-code-review v1.13.3 (annotated tag dd92520 -> commit 375f64c)
        uses: alibaba/open-code-review@375f64cd6f67a48a135da83cfcf59c52669a09cb
        with:
          ocr_version: '1.13.3'
          llm_url: ${{ steps.llm.outputs.url }}
          llm_auth_token: ${{ env.OPENCODE_API_KEY }}   # set by 'Sign in to OpenCode'
          llm_model: ${{ steps.llm.outputs.model }}
          llm_protocol: ${{ steps.llm.outputs.protocol }}
          llm_use_anthropic: ${{ steps.llm.outputs.use_anthropic }}
          llm_extra_body: ${{ steps.llm.outputs.extra_body }}
          llm_reasoning_effort: ${{ steps.llm.outputs.effort }}
          # OCR already sends its own User-Agent (open-code-review/1.13.3); User-Agent is a
          # reserved header in OCR and would be rejected here. Session ID for Go routing/caching:
          llm_extra_headers: 'x-opencode-session={ocr_session_key}'
          language: Thai
          upload_artifacts: 'true'
          # Sticky summary comment (updated in place) + cross-push checkpoint: each push reviews
          # only <last reviewed head>..<new head>; falls back to a full review when unsure
          # (base moved, force-push, config changed). incremental: skip inline comments whose
          # lines already have one from an earlier run (history is never deleted).
          sticky_summary: 'true'
          checkpoint_range: 'true'
          incremental: 'true'
          full_review: 'false'
