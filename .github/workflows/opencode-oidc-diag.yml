name: OpenCode OIDC diagnostic

# Manual diagnostic (playground only): exchange a GitHub OIDC token for an OpenCode service-account token,
# then make tiny requests to the OpenCode Go endpoints. Never prints any token or key:
# only HTTP status codes and non-secret response fields.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      compare_secret:
        description: Also ping the Go anthropic endpoint with secrets.OPENCODE_GO_API_KEY for comparison
        type: boolean
        default: true

permissions: {}

jobs:
  diag:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Sign in to OpenCode (OIDC token exchange)
        # Same curl calls as the OpenCode console snippet, plus status/claim printing. Never prints a token.
        env:
          CLIENT_ID: ${{ vars.OPENCODE_CLIENT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CLIENT_ID" ] || { echo "::error::vars.OPENCODE_CLIENT_ID is not set"; exit 1; }
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://opencode.ai/console" | jq -r .value)
          echo "::add-mask::$oidc"
          echo "GitHub OIDC token: length ${#oidc}"
          # payload claims are not secret (the signature is what matters, and the full token stays masked)
          python3 -c 'import base64,json,sys; c=json.loads(base64.urlsafe_b64decode(sys.argv[1].split(".")[1]+"=="));
          print("OIDC claims:", json.dumps({k: c.get(k) for k in ("iss","aud","sub","repository","ref","event_name","job_workflow_ref","head_ref","base_ref")}))' "$oidc"
          status=$(curl -sS -o /tmp/exch.json -w '%{http_code}' -X POST https://opencode.ai/console/auth/oauth/token \
            -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            -d "client_id=$CLIENT_ID" \
            -d "subject_token=$oidc")
          token=$(jq -r '.access_token // empty' /tmp/exch.json 2>/dev/null || true)
          [ -n "$token" ] && echo "::add-mask::$token"
          echo "OpenCode token exchange: HTTP $status"
          echo "exchange response (secrets removed): $(jq -c 'del(.access_token, .refresh_token, .id_token)' /tmp/exch.json 2>/dev/null || head -c 300 /tmp/exch.json)"
          rm -f /tmp/exch.json
          [ -n "$token" ] || { echo "::error::no access_token in exchange response"; exit 1; }
          case "$token" in oc_sk_*) kind=oc_sk_key;; eyJ*) kind=JWT;; *) kind=other;; esac; echo "access_token: present, length ${#token}, kind $kind"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Ping OpenCode Go endpoints
        env:
          GO_KEY: ${{ (github.event_name == 'pull_request' || inputs.compare_secret) && secrets.OPENCODE_GO_API_KEY || '' }}
        shell: python3 {0}
        run: |
          import json, os, urllib.error, urllib.request

          def call_raw(url, data=None, headers=None):
              # real curl (Cloudflare in front of opencode.ai rejects the Python-urllib signature: error 1010).
              # Headers and body go through files/stdin so no credential appears on a command line.
              import subprocess, tempfile
              with tempfile.TemporaryDirectory() as d:
                  hf, bf, rf = f'{d}/h', f'{d}/b', f'{d}/resp'
                  with open(hf, 'w') as f:
                      f.write(''.join(f'{k}: {v}\n' for k, v in (headers or {}).items()))
                  cmd = ['curl', '-sS', '-o', bf, '-D', rf, '-w', '%{http_code}', '-H', f'@{hf}', url]
                  if data is not None:
                      cmd += ['--data-binary', '@-']
                  p = subprocess.run(cmd, input=data, capture_output=True)
                  if p.returncode:
                      print('curl error:', p.stderr.decode(errors='replace')[:300])
                  body = open(bf, 'rb').read() if os.path.exists(bf) else b''
                  hdr = {}
                  if os.path.exists(rf):
                      for line in open(rf, errors='replace').read().replace('\r', '').strip().split('\n\n')[-1].splitlines()[1:]:
                          if ':' in line:
                              k, v = line.split(':', 1)
                              hdr[k.strip()] = v.strip()
                  return int(p.stdout or 0), body, hdr

          def call(url, payload, headers):
              # Go asks clients to send their own user agent and a stable x-opencode-session per conversation
              # (https://opencode.ai/v2/docs/console/go/#where-can-i-use-it)
              base = {'Content-Type': 'application/json', 'User-Agent': 'ai-pr-review-oidc-diag/1.0',
                      'x-opencode-session': 'oidc-diag-' + os.environ.get('GITHUB_RUN_ID', '0')}
              return call_raw(url, json.dumps(payload).encode(), {**base, **headers})

          def report(name, st, body, hdr):
              print(f'\n== {name}: HTTP {st}')
              # response headers are server-set, never contain our credentials; drop cookies anyway
              keep = {k: v for k, v in hdr.items() if k.lower() not in ('set-cookie', 'cookie', 'authorization')
                      and (k.lower().startswith('x-') or k.lower() in ('content-type', 'server', 'cf-ray', 'openai-model'))}
              print('response headers:', json.dumps(keep))
              try:
                  j = json.loads(body)
              except Exception:
                  print('non-JSON body (first 300 chars):', body[:300].decode(errors='replace'))
                  return
              out = {k: j.get(k) for k in ('id', 'model', 'usage', 'stop_reason', 'cost', 'provider', 'opencode') if k in j}
              if 'choices' in j:
                  out['finish_reason'] = j['choices'][0].get('finish_reason')
                  out['text'] = (j['choices'][0].get('message') or {}).get('content', '')[:40]
              if 'content' in j and isinstance(j['content'], list):
                  out['text'] = ' '.join(c.get('text', '') for c in j['content'] if c.get('type') == 'text')[:40]
              if 'error' in j:
                  out['error'] = j['error']
              print('fields:', json.dumps(out, ensure_ascii=False)[:800])

          tok = os.environ.get('OPENCODE_API_KEY', '')
          msg = [{'role': 'user', 'content': 'Reply with just: ok'}]
          ant = 'https://opencode.ai/inference/go/anthropic/v1/messages'
          oai = 'https://opencode.ai/inference/go/openai/v1/chat/completions'
          ant_body = {'model': 'deepseek-v4.1-flash', 'max_tokens': 16, 'messages': msg}
          oai_body = {'model': 'deepseek-v4.1-flash', 'max_tokens': 16, 'messages': msg}
          v = {'anthropic-version': '2023-06-01'}

          report('token -> Go anthropic (Authorization: Bearer, as OCR llm_auth_token)', *call(ant, ant_body, {**v, 'Authorization': f'Bearer {tok}'}))
          report('token -> Go anthropic (x-api-key)', *call(ant, ant_body, {**v, 'x-api-key': tok}))
          report('token -> Go openai (Bearer, as opencode-go provider)', *call(oai, oai_body, {'Authorization': f'Bearer {tok}'}))
          report('no credential -> Go anthropic (expected 401)', *call(ant, ant_body, v))
          if os.environ.get('GO_KEY'):
              report('secret OPENCODE_GO_API_KEY -> Go anthropic (comparison)', *call(ant, ant_body, {**v, 'Authorization': f"Bearer {os.environ['GO_KEY']}"}))
