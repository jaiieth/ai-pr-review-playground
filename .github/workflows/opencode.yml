name: OpenCode PR Summary

# Summary only (no review findings, no inline comments): when a PR has no real description,
# OpenCode writes a short Thai summary (what the PR is about, main changes, risk areas) and posts
# it as ONE PR comment. The PR body is never edited. OCR (ocr-review.yml) is the reviewer.
# Every trigger goes through the same gates (checked in the first step, against the live PR):
#   body has < OPENCODE_SUMMARY_MIN_CHARS meaningful chars, diff not empty (changed_files > 0),
#   no summary comment yet (posted once, never regenerated), OPENCODE_GO_API_KEY available.
# Triggers:
#   opened / reopened / ready_for_review / synchronize -> non-draft PRs (drafts only if
#       OPENCODE_SUMMARY_DRAFTS == 'true'), head branch not in the skip list
#   edited                       -> only when the body changed
#   labeled with OCR_TRIGGER_LABEL (ai-review) -> drafts too (same label that triggers OCR)
#   workflow_dispatch(pr_number) -> drafts too
# Skips that need no API call (draft, empty diff, other labels, skip-list head branch) cost 0 minutes.
# Required secret: OPENCODE_GO_API_KEY. Optional repo variables:
#   OPENCODE_MODEL            default opencode-go/deepseek-v4.1-flash
#   OPENCODE_SUMMARY_MIN_CHARS default 30  (non-space characters left after removing HTML comments,
#                                           headings, checklist items and empty bullets)
#   OPENCODE_SUMMARY_DRAFTS   default false (true = also summarize drafts on open/push)
#   OCR_TRIGGER_LABEL         default ai-review     (shared with ocr-review.yml)
#   AI_SKIP_HEAD_BRANCHES     default main,develop  (shared with ocr-review.yml)
#   AI_SKIP_HEAD_PREFIX       default release/      (shared with ocr-review.yml; - disables)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, edited, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to summarize (drafts included; still skipped if it has a description)
        required: true
        type: string

permissions: {}

jobs:
  summary:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.changed_files > 0 &&
       ((github.event.action == 'labeled' &&
         github.event.label.name == (vars.OCR_TRIGGER_LABEL || 'ai-review')) ||
        (github.event.action != 'labeled' &&
         (github.event.action != 'edited' || github.event.changes.body != null) &&
         (github.event.action != 'synchronize' || !github.event.pull_request.body) &&
         !contains(format(',{0},', vars.AI_SKIP_HEAD_BRANCHES || 'main,develop'), format(',{0},', github.head_ref)) &&
         !(vars.AI_SKIP_HEAD_PREFIX != '-' && startsWith(github.head_ref, vars.AI_SKIP_HEAD_PREFIX || 'release/')) &&
         (!github.event.pull_request.draft || vars.OPENCODE_SUMMARY_DRAFTS == 'true'))))
    # API-bound work only: the 1-vCPU runner (15-minute job limit) bills at the slim rate.
    runs-on: ubuntu-slim
    timeout-minutes: 12
    concurrency:
      group: opencode-summary-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write   # create / update the sticky summary comment
    env:
      OPENCODE_VERSION: "1.19.5"
      MODEL: ${{ vars.OPENCODE_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
      MARKER: "<!-- opencode-pr-summary -->"
    steps:
      - name: Check description
        id: gate
        env:
          MIN_CHARS: ${{ vars.OPENCODE_SUMMARY_MIN_CHARS || '30' }}
          HAS_KEY: ${{ secrets.OPENCODE_GO_API_KEY != '' }}   # boolean only, never the value
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: python3 {0}
        run: |
          import json, os, re, sys, urllib.request

          pr_number = os.environ['PR_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]*', pr_number):
              print(f'::error::invalid pr_number {pr_number!r}')
              sys.exit(1)
          api = f"https://api.github.com/repos/{os.environ['REPO']}"
          def get(url):
              req = urllib.request.Request(url, headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def meaningful(body):
              body = re.sub(r'<!--.*?-->', '', body or '', flags=re.S)
              keep = []
              for line in body.splitlines():
                  n = re.sub(r'\s+', ' ', re.sub(r'\[[xX ]\]', '[ ]', line.strip()))
                  if not n or re.match(r'^#{1,6}\s', n) or re.match(r'^[-*+]\s*\[ \]', n):
                      continue  # empty line, heading, checklist item (template)
                  if re.fullmatch(r'[-*+>|_=`~.:\s]*', n):
                      continue  # empty bullet / rule
                  keep.append(re.sub(r'^[-*+>]\s*', '', n))
              return ''.join(''.join(keep).split())

          pr = get(f"{api}/pulls/{pr_number}")   # live state (body may have changed since the event)
          chars = len(meaningful(pr.get('body')))
          threshold = int(os.environ['MIN_CHARS'])
          print(f"PR #{pr_number}: state={pr['state']} draft={pr['draft']} "
                f"changed_files={pr['changed_files']} description={chars} meaningful chars (threshold {threshold})")
          reason = None
          if pr['state'] != 'open':
              reason = 'PR is not open'
          elif chars >= threshold:
              reason = 'PR has a description'
          elif pr['changed_files'] == 0:
              reason = 'empty diff (e.g. only an empty first commit)'
          elif os.environ['HAS_KEY'] != 'true':
              reason = 'OPENCODE_GO_API_KEY is not available (fork PR, or Dependabot without a Dependabot secret)'
          else:
              comments = get(f"{api}/issues/{pr_number}/comments?per_page=100")
              if any(os.environ['MARKER'] in (c.get('body') or '') for c in comments):
                  reason = 'summary already posted (it is never regenerated)'
          print(f'skip: {reason}' if reason else 'summarize')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"run={'false' if reason else 'true'}\n")
              f.write(f"base_sha={pr['base']['sha']}\nhead_sha={pr['head']['sha']}\n")
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'pr-title.txt'), 'w', encoding='utf-8') as f:
              f.write(pr['title'])

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      # Own pinned install (the upstream installer action calls the GitHub API unauthenticated
      # for the latest version and fails when the runner IP is rate limited).
      - name: Cache opencode
        if: steps.gate.outputs.run == 'true'
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENCODE_VERSION }}

      - name: Install opencode
        if: steps.gate.outputs.run == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"

      - name: Prepare diff and prompt
        if: steps.gate.outputs.run == 'true'
        env:
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          MAX_DIFF_BYTES: "400000"
        run: |
          PR_TITLE="$(cat "$RUNNER_TEMP/pr-title.txt")"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          git diff --no-color --stat=200 "$BASE_SHA"...HEAD > "$RUNNER_TEMP/stat.txt"
          git diff --no-color "$BASE_SHA"...HEAD > "$RUNNER_TEMP/full.diff"
          head -c "$MAX_DIFF_BYTES" "$RUNNER_TEMP/full.diff" > "$RUNNER_TEMP/pr.diff"
          NOTE=""
          if [ "$(wc -c < "$RUNNER_TEMP/full.diff")" -gt "$MAX_DIFF_BYTES" ]; then
            NOTE="(diff ยาวเกิน แนบมาแค่ส่วนแรก ดูไฟล์ที่เหลือได้ด้วย git diff ${BASE_SHA}...HEAD -- <path>)"
          fi
          {
            echo "สรุป Pull Request #${PR_NUMBER} \"${PR_TITLE}\" เป็นภาษาไทย (ศัพท์เทคนิค ชื่อไฟล์ และชื่อโค้ดใช้ภาษาอังกฤษได้) สำหรับคนที่จะมา review"
            echo "PR นี้ไม่มี description ให้อ่านจาก diff ที่แนบมา (เทียบ ${BASE_SHA}...HEAD) ${NOTE}"
            echo "ใช้ git diff / git show / git log หรืออ่านไฟล์ได้ ห้ามแก้ไฟล์"
            echo
            echo "ไฟล์ที่เปลี่ยน:"
            cat "$RUNNER_TEMP/stat.txt"
            echo
            echo "หน้าที่: สรุปเท่านั้น ไม่ต้องรีวิว ไม่ต้องหาบั๊ก ไม่ต้องเสนอวิธีแก้ (มีเครื่องมือรีวิวแยกต่างหาก)"
            echo "เขียนเป็น Markdown สั้น กระชับ ไม่เกินประมาณ 25 บรรทัด มี 3 หัวข้อนี้ตามลำดับ:"
            echo "### PR นี้เกี่ยวกับอะไร"
            echo "1-3 ประโยค บอกจุดประสงค์ของงาน (module/เอกสาร/endpoint ที่เกี่ยวข้อง)"
            echo "### การเปลี่ยนแปลงหลัก"
            echo "bullet 3-8 ข้อ จัดกลุ่มตาม module หรือไฟล์ ระบุ endpoint, schema/migration, config ที่เพิ่มหรือเปลี่ยน"
            echo "### จุดที่ reviewer ควรดูเป็นพิเศษ"
            echo "bullet 1-5 ข้อ ว่าส่วนไหนเสี่ยงหรือกระทบวงกว้าง (เช่น schema/migration, transaction, เงิน/วันที่, สิทธิ์, การเปลี่ยน API ที่มีคนเรียกอยู่) บอกแค่ว่าควรดูตรงไหนเพราะอะไร ไม่ต้องตัดสินว่าผิด"
            echo
            echo "ตอบกลับด้วยสรุปเท่านั้น ระหว่าง marker ด้านล่าง (ไม่มีข้อความอื่นนอก marker):"
            echo "<<<SUMMARY"
            echo "...markdown..."
            echo "SUMMARY>>>"
          } > "$RUNNER_TEMP/prompt.md"
          echo "diff: $(wc -l < "$RUNNER_TEMP/full.diff") lines, $(wc -c < "$RUNNER_TEMP/full.diff") bytes"

      - name: OpenCode summary
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 8
        env:
          # opencode-go provider reads OPENCODE_API_KEY. No GitHub token is given to the model step.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_CONFIG_CONTENT: >-
            {"$schema":"https://opencode.ai/config.json",
             "permission":{"edit":"deny","webfetch":"deny",
               "bash":{"*":"deny","git diff*":"allow","git show*":"allow","git log*":"allow"}}}
        run: |
          opencode run -m "$MODEL" -f "$RUNNER_TEMP/pr.diff" -- "$(cat "$RUNNER_TEMP/prompt.md")" \
            > "$RUNNER_TEMP/opencode-output.txt"
          echo "output: $(wc -c < "$RUNNER_TEMP/opencode-output.txt") bytes"

      - name: Post sticky summary comment
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        shell: python3 {0}
        run: |
          import json, os, re, sys, urllib.request

          out = open(os.path.join(os.environ['RUNNER_TEMP'], 'opencode-output.txt'), encoding='utf-8').read()
          out = re.sub(r'\x1b\[[0-9;?]*[A-Za-z]', '', out)
          m = re.findall(r'<<<SUMMARY\s*\n(.*?)\n?\s*SUMMARY>>>', out, flags=re.S)
          text = (m[-1] if m else '').strip()
          if not text or text == '...markdown...':
              print('::error::OpenCode returned no summary between the markers')
              sys.exit(1)
          marker = os.environ['MARKER']
          body = (f"{marker}\n## 📝 สรุป PR อัตโนมัติ (OpenCode)\n"
                  f"> PR นี้ยังไม่มี description จึงสรุปจาก diff ที่ `{os.environ['HEAD_SHA'][:7]}` "
                  f"(สรุปอย่างเดียว ไม่ใช่การรีวิว) ถ้าเขียน description แล้ว comment นี้จะไม่ถูกอัปเดตอีก\n\n{text}\n")

          api = f"https://api.github.com/repos/{os.environ['REPO']}"
          hdr = {'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          def call(method, url, data=None):
              req = urllib.request.Request(url, method=method, headers=hdr,
                                           data=json.dumps(data).encode() if data else None)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          comments = call('GET', f"{api}/issues/{os.environ['PR_NUMBER']}/comments?per_page=100")
          mine = [c for c in comments if marker in (c.get('body') or '')
                  and c.get('user', {}).get('login') == 'github-actions[bot]']
          if mine:
              c = call('PATCH', f"{api}/issues/comments/{mine[0]['id']}", {'body': body})
              print(f"updated summary comment {c['html_url']}")
          else:
              c = call('POST', f"{api}/issues/{os.environ['PR_NUMBER']}/comments", {'body': body})
              print(f"posted summary comment {c['html_url']}")
