name: OpenCode Review

# Third reviewer, runs in parallel with ocr-review.yml and pr-agent.yml.
# - Auto: one Thai review comment when a PR is opened / reopened / marked ready.
#   (Not on every push: OpenCode posts a NEW comment per run; use `/oc` to re-review.)
# - On demand: comment `/oc ...` or `/opencode ...` on a PR (or on a diff line).
# Docs: https://opencode.ai/docs/github/

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  opencode:
    # Bot/agent PRs ARE reviewed (no sender/author filter on pull_request).
    # Skips: draft PRs, main <-> develop sync PRs, comments on plain issues,
    #        comments written by bots, and commands from people without write access.
    # Loop safety: replies are posted with GITHUB_TOKEN (github-actions[bot]); GitHub never
    # starts workflows from GITHUB_TOKEN events, and bot comments are filtered here too.
    if: >
      (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        !((github.event.pull_request.head.ref == 'main' && github.event.pull_request.base.ref == 'develop') ||
          (github.event.pull_request.head.ref == 'develop' && github.event.pull_request.base.ref == 'main')))
      ||
      ((github.event_name == 'pull_request_review_comment' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request)) &&
        (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Own group per PR; auto runs and /oc commands don't cancel each other.
    concurrency:
      group: opencode-${{ github.event_name == 'pull_request' && 'auto' || 'cmd' }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    # Review-only: no contents:write, so OpenCode cannot push commits or open PRs.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      REVIEW_PROMPT: |
        รีวิว Pull Request นี้ในฐานะ senior reviewer ของ ERP API (NestJS + Prisma + PostgreSQL) แล้วตอบเป็นภาษาไทยทั้งหมด (ศัพท์เทคนิค/ชื่อโค้ดใช้อังกฤษได้)

        ขอบเขต: ตรวจทุกอย่างที่อาจทำให้ระบบผิด ไม่จำกัดแค่รายการข้างล่าง
        - bug เชิงตรรกะ, off-by-one, เงื่อนไขผิด, null/undefined, async ที่ไม่ได้ await, error ที่ถูกกลืน
        - transaction/ความสอดคล้องของข้อมูล, race condition, optimistic lock, running number/เลขเอกสาร
        - ความปลอดภัย (SQL injection, raw query, authz), การตรวจ input/DTO
        - เงิน/ตัวเลข (float vs Decimal), วันที่และ timezone (Asia/Bangkok), period lock
        - business rule ของเอกสาร (สถานะ, การยกเลิก, เครดิตลูกค้า, stock reservation)

        กติกา:
        - อ่านโค้ดรอบ ๆ ที่เกี่ยวข้องก่อนสรุป อย่ารายงานสิ่งที่ถูกต้องอยู่แล้ว (เช่น tagged template $queryRaw/$executeRaw ปลอดภัย)
        - แต่ละประเด็นให้ระบุ: ระดับ [critical|high|medium|low], ไฟล์:บรรทัด, ปัญหา, ผลกระทบ, วิธีแก้สั้น ๆ
        - เรียงจากร้ายแรงมากไปน้อย ไม่เกิน 15 ประเด็น ปิดท้ายด้วยสรุป 2-3 บรรทัด
        - ห้ามแก้ไขไฟล์ ห้าม commit/push ห้ามสร้าง branch หรือ PR ให้ตอบเป็นข้อความรีวิวเท่านั้น
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: OpenCode (OpenCode Go)
        # anomalyco/opencode/github v1.19.5
        uses: anomalyco/opencode/github@810c0eba1a7348036f8bdf61e6632d0c36c6876c
        env:
          # opencode-go provider reads OPENCODE_API_KEY
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's installer otherwise pulls the latest CLI; pin it to the action version
          VERSION: "1.19.5"
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          use_github_token: true
          # Auto runs use the Thai review prompt; /oc comments use the comment text as the prompt
          prompt: ${{ github.event_name == 'pull_request' && env.REVIEW_PROMPT || '' }}
