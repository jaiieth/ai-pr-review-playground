name: OpenCode Review

# Third reviewer, runs in parallel with ocr-review.yml and pr-agent.yml.
# - Auto: one Thai PR review with INLINE comments when a PR is opened / reopened / marked ready.
#   OpenCode CLI (read-only: no edits, bash limited to git diff/show/log) returns JSON findings;
#   .github/scripts/opencode_inline_review.py checks each line against the diff and posts one
#   review. Findings outside the diff go into the review body. Not on every push: use `/oc`.
# - On demand: comment `/oc ...` or `/opencode ...` on a PR (or on a diff line).
# Docs: https://opencode.ai/docs/github/

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  opencode:
    # Bot/agent PRs ARE reviewed (no sender/author filter on pull_request).
    # Skips: draft PRs, main <-> develop sync PRs, comments on plain issues,
    #        comments written by bots, and commands from people without write access.
    # Loop safety: replies are posted with GITHUB_TOKEN (github-actions[bot]); GitHub never
    # starts workflows from GITHUB_TOKEN events, and bot comments are filtered here too.
    if: >
      (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        !((github.event.pull_request.head.ref == 'main' && github.event.pull_request.base.ref == 'develop') ||
          (github.event.pull_request.head.ref == 'develop' && github.event.pull_request.base.ref == 'main')))
      ||
      ((github.event_name == 'pull_request_review_comment' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request)) &&
        (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Own group per PR; auto runs and /oc commands don't cancel each other.
    concurrency:
      group: opencode-${{ github.event_name == 'pull_request' && 'auto' || 'cmd' }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    # Review-only: no contents:write, so OpenCode cannot push commits or open PRs.
    # pull-requests:write is needed to create the review with inline comments.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      OPENCODE_VERSION: "1.19.5"
      MODEL: ${{ vars.OPENCODE_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Auto review: PR head, so line numbers match the PR diff (default is the merge commit).
          ref: ${{ github.event.pull_request.head.sha || '' }}
          fetch-depth: 0
          persist-credentials: false

      # Own install instead of anomalyco/opencode/github: its first step calls the GitHub API
      # unauthenticated for the latest version and fails the job when the runner IP is rate
      # limited (seen on PR #5). A pinned version downloads straight from the release assets.
      - name: Cache opencode
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENCODE_VERSION }}

      - name: Install opencode
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"

      - name: Add opencode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # ---------- Auto review (pull_request): JSON findings -> inline PR review ----------
      - name: Prepare diff and prompt
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git diff --no-color "$BASE_SHA"...HEAD > "$RUNNER_TEMP/pr.diff"
          RANGES=$(python3 .github/scripts/opencode_inline_review.py ranges "$RUNNER_TEMP/pr.diff")
          cat > "$RUNNER_TEMP/prompt.md" <<PROMPT
          รีวิว Pull Request #${PR_NUMBER} ในฐานะ senior reviewer ของ ERP API (NestJS + Prisma + PostgreSQL) เขียน title/body/summary เป็นภาษาไทย (ศัพท์เทคนิค/ชื่อโค้ดใช้อังกฤษได้)

          diff ของ PR แนบมาเป็นไฟล์ (เทียบ ${BASE_SHA}...HEAD) ใช้ git diff / git show / อ่านไฟล์ได้ ห้ามแก้ไฟล์

          ขอบเขต: ตรวจทุกอย่างที่อาจทำให้ระบบผิด ไม่จำกัดแค่รายการข้างล่าง
          - bug เชิงตรรกะ, off-by-one, เงื่อนไขผิด, null/undefined, async ที่ไม่ได้ await, error ที่ถูกกลืน
          - transaction/ความสอดคล้องของข้อมูล, race condition, optimistic lock, running number/เลขเอกสาร
          - ความปลอดภัย (SQL injection, raw query, authz), การตรวจ input/DTO
          - เงิน/ตัวเลข (float vs Decimal), วันที่และ timezone (Asia/Bangkok), period lock
          - business rule ของเอกสาร (สถานะ, การยกเลิก, เครดิตลูกค้า, stock reservation)

          กติกา:
          - อ่านโค้ดรอบ ๆ ที่เกี่ยวข้องก่อนสรุป อย่ารายงานสิ่งที่ถูกต้องอยู่แล้ว (เช่น tagged template \$queryRaw/\$executeRaw ปลอดภัย)
          - ไม่เกิน 15 ประเด็น หนึ่งประเด็นต่อหนึ่งจุดในโค้ด
          - line = เลขบรรทัดในไฟล์เวอร์ชันใหม่ (HEAD) ที่ปัญหาอยู่ ต้องอยู่ในช่วงที่ comment ได้ด้านล่าง ถ้าปัญหาอยู่นอกช่วง ให้เลือกบรรทัดใน diff ที่เกี่ยวข้องที่สุด หรือใส่ path/line จริงไว้ (ระบบจะย้ายไปไว้ในสรุป)
          - start_line (ไม่บังคับ) ใช้เมื่อปัญหาครอบหลายบรรทัด ต้องอยู่ใน hunk เดียวกับ line
          - suggestion (ไม่บังคับ) = โค้ดใหม่ทั้งก้อนที่จะ "แทนที่" บรรทัด start_line..line ทุกบรรทัด พร้อม indent เดิม ใส่เฉพาะเมื่อมั่นใจและแก้ได้ในจุดนั้นจริง ไม่ต้องใส่ backticks

          ช่วงบรรทัดที่ comment ได้ (ไฟล์: ช่วงบรรทัดใน HEAD):
          ${RANGES}

          ตอบกลับด้วย JSON เท่านั้นระหว่าง marker ด้านล่าง (ไม่มีข้อความอื่นนอก marker):
          <<<FINDINGS_JSON
          {"summary": "สรุป 2-3 บรรทัด", "findings": [{"path": "src/x.ts", "line": 42, "start_line": 40, "severity": "critical|high|medium|low", "title": "หัวข้อสั้น", "body": "ปัญหา ผลกระทบ วิธีแก้", "suggestion": "โค้ดแทนที่ (ไม่บังคับ)"}]}
          FINDINGS_JSON>>>
          PROMPT
          echo "diff: $(wc -l < "$RUNNER_TEMP/pr.diff") lines"; echo "$RANGES"

      - name: OpenCode review (JSON findings)
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        env:
          # opencode-go provider reads OPENCODE_API_KEY. No GitHub token is given to the model step.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_CONFIG_CONTENT: >-
            {"$schema":"https://opencode.ai/config.json",
             "permission":{"edit":"deny","webfetch":"deny",
               "bash":{"*":"deny","git diff*":"allow","git show*":"allow","git log*":"allow"}}}
        run: |
          opencode run -m "$MODEL" -f "$RUNNER_TEMP/pr.diff" -- "$(cat "$RUNNER_TEMP/prompt.md")" \
            | tee "$RUNNER_TEMP/opencode-output.txt"

      - name: Post inline review
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/opencode_inline_review.py post "$RUNNER_TEMP/pr.diff" "$RUNNER_TEMP/opencode-output.txt"

      # ---------- On demand (/oc comments): OpenCode's own GitHub agent replies in the thread ----------
      - name: OpenCode (/oc command)
        if: github.event_name != 'pull_request'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          USE_GITHUB_TOKEN: "true"
        run: opencode github run
